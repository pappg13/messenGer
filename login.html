<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico">
  <title>Sign in · messenGer</title>
  <link rel="stylesheet" href="style.css">

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
  <script src="firebase.js"></script>
</head>
<body class="auth-page">
  <main class="auth">
    <h1 class="wordmark">messenGer</h1>
    <p class="tagline">Voice messages for the family.</p>

    <div id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button class="btn" id="signInBtn">Sign in</button>
      <div id="errorMessage" class="error-message" role="alert"></div>

      <div class="divider">or</div>
      <button class="btn secondary" id="googleSignIn">
        <svg class="icon" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
      </button>
      <div class="switch-form">
        New here? <a href="#" id="showSignUp">Create an account</a>
      </div>
    </div>

    <div id="signUpForm" hidden>
      <div class="field">
        <label for="signUpEmail">Email</label>
        <input type="email" id="signUpEmail" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="signUpPassword">Password (min 6 characters)</label>
        <input type="password" id="signUpPassword" minlength="6" autocomplete="new-password" required>
      </div>
      <button class="btn" id="signUpBtn">Create account</button>
      <div id="signUpErrorMessage" class="error-message" role="alert"></div>
      <div class="switch-form">
        Already have an account? <a href="#" id="showLogin">Sign in</a>
      </div>
    </div>
  </main>

  <script src="auth.js"></script>
</body>
</html>
